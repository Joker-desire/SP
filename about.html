<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>关于 S·P</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f5f4f1;
        --text: #1d1d1f;
        --dim: rgba(29, 29, 31, 0.55);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1a1a1c;
          --text: #f0efec;
          --dim: rgba(240, 239, 236, 0.55);
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
        -webkit-user-select: none;
        user-select: none;
        cursor: default;
      }
      .about {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 24px;
        max-width: 100%;
      }
      .about img {
        width: 96px;
        height: 96px;
        margin-bottom: 14px;
      }
      /* logo 的字是深色的：深色模式下整体转纯白单色，
         否则黑字贴在深底上看不见；透明底不受影响 */
      @media (prefers-color-scheme: dark) {
        .about img {
          filter: brightness(0) invert(1);
        }
      }
      .name {
        font-size: 21px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }
      .version {
        margin-top: 5px;
        font-size: 12px;
        color: var(--dim);
      }
      .slogan {
        margin-top: 18px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        max-width: 100%;
      }
      .slogan .en {
        font-size: 12.5px;
        letter-spacing: 0.01em;
      }
      .slogan .cn {
        font-size: 11.5px;
        color: var(--dim);
        letter-spacing: 0.06em;
      }
      .note {
        margin-top: 26px;
        font-size: 10.5px;
        color: var(--dim);
        line-height: 1.7;
        max-width: 250px;
      }
    </style>
  </head>
  <body>
    <div class="about">
      <img src="/logo-about.png" alt="S·P" draggable="false" />
      <span class="name">S·P</span>
      <span class="version" id="version"></span>
      <span class="slogan">
        <span class="en">Shoot thousands. Keep the best.</span>
        <span class="cn">千张过手，好片留下。</span>
      </span>
      <span class="note">本地摄影选片工具 · 原片只读，选片结果永不丢</span>
    </div>
    <script type="module" src="/src/about.ts"></script>
  </body>
</html>
