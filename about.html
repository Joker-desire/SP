<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>关于 S·P</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f5f4f1;
        --text: #1d1d1f;
        --dim: rgba(29, 29, 31, 0.55);
        --border: rgba(29, 29, 31, 0.12);
        --btn-bg: rgba(29, 29, 31, 0.045);
        --btn-hover: rgba(29, 29, 31, 0.09);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1a1a1c;
          --text: #f0efec;
          --dim: rgba(240, 239, 236, 0.55);
          --border: rgba(240, 239, 236, 0.14);
          --btn-bg: rgba(240, 239, 236, 0.07);
          --btn-hover: rgba(240, 239, 236, 0.13);
        }
      }
      /* .dialog 自己带 display，必须让 hidden 压得住 */
      [hidden] { display: none !important; }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
        -webkit-user-select: none;
        user-select: none;
        cursor: default;
      }
      .about {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 24px;
        max-width: 100%;
      }
      .about img {
        width: 96px;
        height: 96px;
        margin-bottom: 14px;
      }
      /* logo 的字是深色的：深色模式下整体转纯白单色，
         否则黑字贴在深底上看不见；透明底不受影响 */
      @media (prefers-color-scheme: dark) {
        .about img {
          filter: brightness(0) invert(1);
        }
      }
      .name {
        font-size: 21px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }
      .version {
        margin-top: 5px;
        font-size: 12px;
        color: var(--dim);
      }
      .slogan {
        margin-top: 18px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        max-width: 100%;
      }
      .slogan .en {
        font-size: 12.5px;
        letter-spacing: 0.01em;
      }
      .slogan .cn {
        font-size: 11.5px;
        color: var(--dim);
        letter-spacing: 0.06em;
      }
      .note {
        margin-top: 26px;
        font-size: 10.5px;
        color: var(--dim);
        line-height: 1.7;
        max-width: 250px;
      }

      /* ── 检查更新 ─────────────────────────────────────────────────── */
      .update-row {
        margin-top: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      .check-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 7px 15px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--btn-bg);
        color: var(--text);
        font: inherit;
        font-size: 11.5px;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.16s ease, transform 0.16s ease;
      }
      .check-btn:hover:not(:disabled) { background: var(--btn-hover); }
      .check-btn:active:not(:disabled) { transform: translateY(1px); }
      .check-btn:disabled { opacity: 0.5; cursor: default; }
      .check-btn:focus-visible {
        outline: 2px solid var(--text);
        outline-offset: 2px;
      }
      .check-btn svg { width: 13px; height: 13px; flex: none; }
      .update-status {
        margin: 0;
        max-width: 260px;
        min-height: 15px;
        font-size: 10.5px;
        line-height: 1.5;
        color: var(--dim);
      }

      /* ── 结果弹窗（自绘，与关于页同一套配色）──────────────────────── */
      .dialog {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: rgba(0, 0, 0, 0.3);
        -webkit-backdrop-filter: blur(4px);
        backdrop-filter: blur(4px);
        animation: dialog-in 0.16s ease-out;
      }
      @keyframes dialog-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .dialog-box {
        width: 100%;
        max-width: 258px;
        padding: 16px 16px 13px;
        border: 1px solid var(--border);
        border-radius: 13px;
        background: var(--bg);
        box-shadow: 0 14px 40px rgba(0, 0, 0, 0.24);
        text-align: left;
      }
      .dialog-title {
        margin: 0;
        font-size: 13px;
        font-weight: 650;
        color: var(--text);
      }
      .dialog-text {
        margin: 9px 0 0;
        font-size: 11.5px;
        line-height: 1.65;
        color: var(--dim);
      }
      .dialog-actions {
        display: flex;
        justify-content: flex-end;
        margin-top: 15px;
      }
      .dialog-ok {
        padding: 5px 16px;
        border: 0;
        border-radius: 7px;
        background: var(--text);
        color: var(--bg);
        font: inherit;
        font-size: 11.5px;
        font-weight: 550;
        cursor: pointer;
      }
      .dialog-ok:focus-visible {
        outline: 2px solid var(--text);
        outline-offset: 2px;
      }
      @media (prefers-reduced-motion: reduce) {
        .dialog { animation: none; }
        .check-btn { transition: none; }
      }
    </style>
  </head>
  <body>
    <div class="about">
      <img src="/logo-about.png" alt="S·P" draggable="false" />
      <span class="name">S·P</span>
      <span class="version" id="version"></span>
      <span class="slogan">
        <span class="en">Shoot thousands. Keep the best.</span>
        <span class="cn">千张过手，好片留下。</span>
      </span>
      <span class="note">本地摄影选片工具 · 原片只读，选片结果永不丢</span>

      <div class="update-row">
        <button class="check-btn" id="check-update" type="button">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M8 2.4v7.2M5.2 7 8 9.8 10.8 7" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M2.8 11.2v1.4c0 .6.5 1.1 1.1 1.1h8.2c.6 0 1.1-.5 1.1-1.1v-1.4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
          </svg>
          <span id="check-update-text">检查更新</span>
        </button>
        <p class="update-status" id="update-status" role="status" aria-live="polite"></p>
      </div>
    </div>

    <div class="dialog" id="update-dialog" hidden role="dialog" aria-modal="true" aria-labelledby="update-dialog-title">
      <div class="dialog-box">
        <h2 class="dialog-title" id="update-dialog-title">检查更新</h2>
        <p class="dialog-text" id="update-dialog-text"></p>
        <div class="dialog-actions">
          <button class="dialog-ok" id="update-dialog-ok" type="button">好</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/about.ts"></script>
  </body>
</html>
